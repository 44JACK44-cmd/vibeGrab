org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# On some Windows setups the Kotlin plugin fails to close its incremental
# caches ("Could not close incremental caches ..."), aborting assembleDebug for
# every Kotlin-based plugin. Disabling incremental compilation keeps builds
# reliable (only slightly slower for incremental rebuilds).
kotlin.incremental=false
